services:
  app-main:
    build: .
    env_file: ./envs/.env.main
    ports:
      - "8080:8080"
    volumes:
      - ./ssl/cert.pem:/app/ssl/cert.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  app-shard1:
    build: .
    env_file: ./envs/.env.shard1
    ports:
      - "8081:8081"
    volumes:
      - ./ssl/cert.pem:/app/ssl/cert.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  app-shard2:
    build: .
    env_file: ./envs/.env.shard2
    ports:
      - "8082:8082"
    volumes:
      - ./ssl/cert.pem:/app/ssl/cert.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  app-shard3:
    build: .
    env_file: ./envs/.env.shard3
    ports:
      - "8083:8083"
    volumes:
      - ./ssl/cert.pem:/app/ssl/cert.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  app-shard4:
    build: .
    env_file: ./envs/.env.shard4
    ports:
      - "8084:8084"
    volumes:
      - ./ssl/cert.pem:/app/ssl/cert.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  app-shard5:
    build: .
    env_file: ./envs/.env.shard5
    ports:
      - "8085:8085"
    volumes:
      - ./ssl/cert.pem:/app/ssl/cert.pem:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: miogram
      POSTGRES_USER: miogram
      POSTGRES_PASSWORD: miogram
      TZ: Asia/Tehran
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miogram -d miogram"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
